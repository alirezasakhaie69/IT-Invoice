{% extends "base.html" %}
{% block body %}
<div class="login-shell">
  <form class="card login-card" method="post" action="/login">
    <h1>{{ t('login_title') }}</h1>
    {% if error %}
    <div class="alert alert-error">{{ t(error) }}</div>
    {% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <div class="field">
      <label for="username">{{ t('username') }}</label>
      <input class="input" id="username" name="username" autocomplete="username" required value="{{ username or '' }}">
    </div>
    <div class="field">
      <label for="password">{{ t('password') }}</label>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" type="submit">{{ t('sign_in') }}</button>
  </form>
</div>
{% endblock %}
