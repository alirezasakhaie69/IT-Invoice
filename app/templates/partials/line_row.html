<div class="line-row">
  <div class="line-field">
    <label>&nbsp;</label>
    <label class="line-pick"><input type="checkbox" class="line-check"> <span class="line-no"></span></label>
  </div>
  <div class="line-field">
    <label>{{ t('description') }}</label>
    <textarea class="input line-text" name="description" rows="1" maxlength="2000">{{ line.description }}</textarea>
  </div>
  <div class="line-field">
    <label>{{ t('quantity') }}</label>
    <input class="input grouped" name="quantity" inputmode="numeric" value="{{ line.quantity }}">
  </div>
  <div class="line-field">
    <label>{{ t('unit') }}</label>
    <input class="input" name="unit" maxlength="40" value="{{ line.unit }}">
  </div>
  <div class="line-field">
    <label>{{ t('unit_price') }}</label>
    <input class="input grouped" name="unit_price" inputmode="numeric" value="{{ line.unit_price }}">
    <p class="hint applied-note"></p>
  </div>
  <div class="line-field">
    <label>{{ t('discount') }}</label>
    <input class="input grouped" name="discount" inputmode="numeric" value="{{ line.discount }}">
  </div>
  <div class="line-field">
    <label>{{ t('tax_percent') }}</label>
    <input class="input grouped" name="tax_percent" inputmode="numeric" value="{{ line.tax_percent }}">
  </div>
  <div class="line-field">
    <label>&nbsp;</label>
    <div class="line-actions">
      <button class="btn btn-small btn-move" type="button" data-move="-1" title="{{ t('move_up') }}">↑</button>
      <button class="btn btn-small btn-move" type="button" data-move="1" title="{{ t('move_down') }}">↓</button>
      <input class="input line-jump" inputmode="numeric" placeholder="{{ t('row_pos') }}">
      <button class="btn btn-small btn-jump" type="button" data-jump>{{ t('jump') }}</button>
      <button class="btn btn-small btn-remove-line" type="button" onclick="this.closest('.line-row').remove()">{{ t('remove') }}</button>
    </div>
  </div>
</div>
